[package]
name = "ksuid"
version = "0.1.0"
edition = "2021"
description = "K-Sortable Unique Identifier (KSUID) — compatible with segmentio/ksuid"
license = "MIT"
repository = "https://github.com/owpz/ksuid-rs"
homepage = "https://github.com/owpz/ksuid-rs"
keywords = ["ksuid", "uuid", "unique-id", "sortable", "identifier"]
categories = ["data-structures", "encoding"]
readme = "README.md"

[dependencies]
getrandom = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ksuid"
path = "src/bin/ksuid.rs"
